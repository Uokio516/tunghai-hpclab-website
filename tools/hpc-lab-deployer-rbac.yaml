apiVersion: v1
kind: ServiceAccount
metadata:
  name: hpc-lab-deployer
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hpc-lab-deployer
  namespace: default
rules:
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [hpc-lab-site, hpc-lab-history, hpc-lab-members]
    verbs: [get, patch]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [list, watch]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get, list, watch]
  - apiGroups: ['']
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hpc-lab-deployer
  namespace: default
subjects:
  - kind: ServiceAccount
    name: hpc-lab-deployer
    namespace: default
roleRef:
  kind: Role
  name: hpc-lab-deployer
  apiGroup: rbac.authorization.k8s.io
