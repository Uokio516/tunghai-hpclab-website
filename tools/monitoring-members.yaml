apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hpc-lab-members
  namespace: default
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hpc-lab-members
  namespace: default
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: hpc-lab-members
  template:
    metadata:
      labels:
        app: hpc-lab-members
    spec:
      containers:
        - name: members
          image: pokai516/hpc-lab:latest
          imagePullPolicy: Always
          command: ["npx", "tsx", "member-service.ts"]
          ports:
            - containerPort: 3002
          env:
            - name: PORT
              value: "3002"
            - name: NODE_ENV
              value: production
            - name: MEMBER_DATA_DIR
              value: /app/members
            - name: MEMBER_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hpc-lab-member-secret
                  key: MEMBER_SERVICE_TOKEN
          volumeMounts:
            - name: data
              mountPath: /app/members
          readinessProbe:
            httpGet:
              path: /health
              port: 3002
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hpc-lab-members
---
apiVersion: v1
kind: Service
metadata:
  name: hpc-lab-members
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: hpc-lab-members
  ports:
    - port: 3002
      targetPort: 3002
